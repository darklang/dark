version: 2.1

# The build and release jobs. Pipelines start in .circleci/config.yml, which finds or
# builds the images below and continues here with them as parameters.

# There is a strong connection between this file and the dev build, which lives in
# scripts/build/compile and scripts/build/_buildplan.py. Generally, if you add
# something to this file, there's an equivalent to be added there. CI doesn't run
# compile itself; it drives _dotnet-wrapper directly, so the two can drift.

# Secrets live in CircleCI contexts, each named only by the job that needs it and restricted
# in CircleCI to the pipelines it is for; the project itself holds none. So a branch, a fork PR
# or a Dependabot build gets no secret, whatever its copy of this file says.
#
#   github-release      GITHUB_RELEASES_TOKEN               publish-release-clis, on v* tags
#   dockerhub-publish   DOCKER_HUB_USER, DOCKER_HUB_TOKEN   publish-images in config.yml, on main
#
# Caches: any pipeline in this repo can write any cache key, including one main is about to
# ask for, because a branch's config picks its own keys. So main and the release jobs restore
# none, and only branch and PR builds use the NuGet one. Measured: restoring costs 1.5s and
# saves 4.9s of `tool restore` + `paket restore`, so it earns about 3.4s a job. The SQLite
# archive cache (`sqlite-archive`) follows the same rule.
#
# Main saves none either. Nothing on main reads one, and a fork PR cannot read main's (CircleCI
# keeps fork caches apart), so each new key was stored twice and main's copy was never used.

parameters:
  # Set by .circleci/config.yml from scripts/deployment/ci-images, pinned by digest.
  ci-image:
    type: string
    default: ""
  release-image:
    type: string
    default: ""
  # Set by .circleci/config.yml on main when main's tip is already a newer commit: that
  # commit, whose own pipeline builds this one's changes too. See scripts/deployment/ci-superseded.
  superseded-by:
    type: string
    default: ""
  # Set by .circleci/config.yml when a green build already checked this commit's tree: the
  # ok-to-deploy job that says so. See scripts/deployment/ci-proven.
  proven-by:
    type: string
    default: ""
  # Set by .circleci/config.yml on a branch or PR that changes only prose. See
  # scripts/deployment/ci-docs-only.
  docs-only:
    type: boolean
    default: false

  # The release matrix (NativeAOT, every OS) runs only on a pushed tag. Set this
  # to true to run it on every push to a branch as well, which is how it was
  # built out: a fan-out across three runner types is not something you get
  # right without iterating on it. Pair it with the `release-filters` anchor
  # further down, which also has to allow the branch.
  release-matrix-on-every-push:
    type: boolean
    default: false

executors:
  # For ok-to-deploy, which only runs `true` and which every pipeline waits on last. A
  # few-MB image starts in a few seconds; cimg/base was a 250 MiB pull, most of that job.
  simple-executor:
    docker:
      - image: alpine:3.22@sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034
    resource_class: small
  in-container:
    working_directory: ~/app
    environment:
      IN_DEV_CONTAINER: true
    docker:
      - image: << pipeline.parameters.ci-image >>

  # Builds the linux release artifacts. Deliberately not dark-base:
  #
  #   - dark-base is ubuntu:24.04, and an AOT binary built there requires
  #     GLIBC_2.38. Today's R2R binary requires only GLIBC_2.27, so that would
  #     be a silent compatibility regression. This image is 20.04 (glibc 2.31).
  #   - NativeAOT links through a C compiler, and the default gcc cannot
  #     cross-target (it rejects ilc's `--target=<triple>` outright). This
  #     image carries clang and cross sysroots, so one x64 runner produces all
  #     four linux artifacts.
  #
  # Built from Dockerfile.build-base. There is no arm runner in this workflow on
  # purpose: dark-base is published amd64-only, so an arm resource class has
  # no image to run.
  release-linux:
    working_directory: ~/app
    environment:
      IN_DEV_CONTAINER: true
    docker:
      - image: << pipeline.parameters.release-image >>

  # musl has to be built ON musl: cross-compiling to it from glibc is the part
  # that fights you, and this way clang, the loader and the libc all agree.
  # arm64 is cross-linked here too, against an Alpine aarch64 sysroot, so it
  # needs no arm runner.
  # Stock Microsoft image plus a few apk packages, so no custom image needed.
  release-musl:
    working_directory: ~/app
    environment:
      IN_DEV_CONTAINER: true
    docker:
      # 10.0-alpine, by digest so the build doesn't change under us.
      - image: mcr.microsoft.com/dotnet/sdk@sha256:5562fd626eec39f6f53218f9b7d7856ab7195d51d846568304fbe85071a3b6e6

  # CircleCI's macOS executors are bare VMs with no Docker, so there's no
  # container for the scripts to enter. IN_DEV_CONTAINER is what tells
  # _assert-in-container not to re-enter and just run, which is exactly how
  # the in-container executor above uses it: CI is already inside its image.
  # The job installs .NET and zig itself (scripts/build/install-release-toolchain) and
  # takes the seed database over the workspace rather than building one.
  macos-builder:
    working_directory: ~/app
    environment:
      IN_DEV_CONTAINER: true
    macos:
      xcode: "16.4.0"
    # No `macos.` prefix. The supported classes are `m4pro.medium` and
    # `m4pro.large`, spelled exactly like that; prefixing them is rejected as
    # "not a valid resource class", and the same message then mentions pricing
    # plans, which is boilerplate rather than a diagnosis.
    resource_class: m4pro.medium

commands:
  # Complete logs/reports, compressed. The previous whole-rundir uploads
  # retained gigabytes of disposable test databases. Log sizes are reported
  # in manifest.json; diagnostic content is not truncated to meet a budget.
  store-ci-diagnostics:
    steps:
      - run:
          name: Snapshot databases used by failed checks
          when: on_fail
          # Check records select working databases, excluding successful gates
          # and backups. SQLite backup includes committed WAL contents.
          command: python3 .circleci/collect_diagnostics.py --failure-databases
      - run:
          name: Compress complete logs and test reports
          when: always
          command: python3 .circleci/collect_diagnostics.py
      - store_artifacts:
          path: /home/dark/.darklang/ci-diagnostics
      - store_test_results:
          path: /home/dark/.darklang/test_results

  # Every release build job finishes the same way, so it lives here once.
  package-clis:
    description: Gzip the built CLIs and hand them to the publish job
    steps:
      - run:
          name: Gzip artifacts
          command: |
            # Only the binaries. The `.mode` beside each one is for the perf tooling and
            # stays as it is; publish-github-release uploads only the `.gz` files.
            # POSIX `case`, not `[[`: the musl job runs this on Alpine.
            for f in clis/darklang-*; do
              case "$f" in *.mode) ;; *) gzip -f "$f" ;; esac
            done
      # No store_artifacts: the GitHub release is where these are downloaded from.
      - persist_to_workspace:
          root: "."
          paths:
            - clis

  # Branch and PR builds only: see the note on caches at the top of this file.
  nuget-cache-restore:
    steps:
      - run: shasum backend/paket.lock backend/global.json > ../checksum
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - restore_cache:
                keys:
                  - v7-nuget-{{ checksum "../checksum" }}
                  # prefix match: an older lockfile's downloads still beat starting empty
                  - v7-nuget-

  # The SQLite archive the native link needs. It only changes with build-sqlite.sh, which
  # pins the SQLite version, so it is cached on that file; building it is about 20s of zig, on
  # one CPU, so it builds beside the steps after it and `sqlite-archive-wait` collects it.
  # Branch and PR builds only, like the NuGet cache: see the note at the top of this file.
  sqlite-archive:
    steps:
      - run:
          name: Hash build-sqlite.sh for cache key
          command: shasum scripts/build/build-sqlite.sh > ../sqlite-checksum
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - restore_cache:
                keys:
                  - v1-sqlite-archive-ci-linux-x64-{{ checksum "../sqlite-checksum" }}
      - run:
          name: Build the SQLite archive (skips on cache hit; beside the next steps)
          background: true
          command: .circleci/beside start sqlite -- ./scripts/build/build-sqlite.sh --runtimes=linux-x64
  sqlite-archive-wait:
    steps:
      - run:
          name: Wait for the SQLite archive
          command: .circleci/beside wait sqlite
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                paths:
                  - backend/src/Cli/lib
                key: v1-sqlite-archive-ci-linux-x64-{{ checksum "../sqlite-checksum" }}

  show-large-files-and-directories:
    steps:
      - run:
          # show any file or directory over 50M in size
          # note alpine find doesn't support +50M here
          name: show large files and directories
          command: |
            find ~ -size +51200k -exec du -h {} \;
            du -ht 50M

  ##########################
  # Check the worktree
  ##########################
  assert-clean-worktree:
    steps:
      - run:
          name: Assert the worktree is clean
          command: "bash -c '[[ -z $(git status -s) ]] && echo Workdir is clean || { echo Workdir is not clean:; git status -s; $(exit 1); }'"

  ##########################
  # Checkout - need to remove some things for a clean checkout
  ##########################
  darkcheckout:
    steps:
      # To get ownership right when mounting volumes in local development, the
      # container adds a bunch of directories within ~/app. However, in Circle,
      # we don't use volumes and the container is loaded before the git
      # checkout, which complains if the checkout directory is not empty. So
      # let's delete those first.
      - run: rm -Rf /home/dark/app/*
      - checkout

  # The same tree in about 3s instead of about 40s, for the jobs every PR waits on.
  #
  # The built-in `checkout` clones the whole history (over 250k objects) every job.
  # Nothing in these jobs reads history: they ask git for HEAD and for `status`, both of
  # which a one-commit fetch answers. The repo is public, so this goes over https and needs
  # no key. A fork's PR commit is fetchable from darklang/dark through its `refs/pull` ref.
  shallow-checkout:
    steps:
      - run:
          name: Checkout code (this commit only)
          command: |
            rm -Rf /home/dark/app/*
            git init -q .
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            if ! git fetch -q --depth=1 origin "$CIRCLE_SHA1"; then
              # Fetching by hash is the normal path; a PR's own ref is the fallback.
              git fetch -q --depth=1 origin "refs/pull/${CIRCLE_PULL_REQUEST##*/}/head"
            fi
            git checkout -q --detach FETCH_HEAD
            [[ "$(git rev-parse HEAD)" == "$CIRCLE_SHA1" ]] \
              || { echo "checked out $(git rev-parse HEAD), expected $CIRCLE_SHA1"; exit 1; }
            git log -1 --format='HEAD is now at %h %s'

  ##########################
  # Setup app
  ##########################
  setup-app:
    steps:
      - run:
          name: Setup build environment
          command: |
            set -x
            scripts/devcontainer/_setup-circleci-environment
            scripts/devcontainer/_create-app-directories
            scripts/devcontainer/_create-cache-directories
            scripts/devcontainer/_setup-hosts

##########################
# Actual workflow
##########################
jobs:
  #
  ## All jobs related to the 'build' of Darklang

  # Build Darklang and run every check a PR waits on.
  #
  # One job, because the F# tests and the package tests need the same build: LocalExec, a
  # loaded store, the seed and the NativeAOT CLI, about four minutes on this class. Split in
  # two jobs, each would build all of it.
  build:
    executor: in-container
    # medium+ (3 CPUs, 6 GB) at 15 credits a minute, against large's 20. The compiles
    # barely use a fourth CPU and only the test suites slow down, so the job takes about
    # an eleventh longer and costs about a sixth less. medium (2 CPUs, 4 GB) costs less
    # again but takes about three minutes longer and reaches its memory limit in the tests.
    resource_class: medium+
    #
    # The allocation gate runs against the NativeAOT binary built here, because the budget is
    # recorded against one: that is what ships. A plain `dotnet publish -c Release` would be
    # meaningless to measure against it.
    #
    # NOT more nodes with `--shard`, though the runner supports it and it is tested. Measured
    # against the whole suite in one process, sharding LOSES: a sequenced group cannot be
    # divided, so one shard ends up carrying most of them and gates the job, while the others
    # finish early. It becomes worth turning on when the sequenced groups are small, which
    # means the remaining CLI suites moving onto `CliInstance`.
    steps:
      - shallow-checkout
      - setup-app
      # Lint, format and the CI scripts' own tests: about half a minute, and the likeliest to
      # fail. Beside the restore and the first compile, which leave a CPU free; the job fails
      # at the wait after that compile. See .circleci/beside.
      - run:
          name: Lint, formatting and the CI scripts' tests (beside the next steps)
          background: true
          command: .circleci/beside start quick-checks -- .circleci/quick-checks
      # There are currently no yaml files
      # - run: scripts/linting/yamllinter

      - nuget-cache-restore
      - show-large-files-and-directories
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                paths:
                  - /home/dark/.nuget
                key: v7-nuget-{{ checksum "../checksum" }}
      # DebugType=None and DebugSymbol=false tells dotnet not to copy .pdb files to publish/

      # Each library is compiled once in this job, by this step, in Release so the package load
      # runs optimized. The two builds below reuse them: the package load rewrites
      # package-ref-hashes.txt, which only Cli embeds.
      - run:
          name: Build LocalExec for migrations (Release)
          command: ./scripts/build/_dotnet-wrapper publish -c Release src/LocalExec/LocalExec.fsproj /p:DebugType=None /p:DebugSymbols=false
      - run:
          name: Wait for lint, formatting and the CI scripts' tests
          command: .circleci/beside wait quick-checks

      # The tests compile beside the package load and the SQLite archive, which leave CPU free
      # and which the tests don't need. One after the other, the compile was about 45s more.
      # It is collected after the CLI build, in case it runs into it.
      #
      # Like the CLI build below, this compiles only its own project (BuildProjectReferences=
      # false) and reads the libraries the step above built. Without it, the CLI's restore,
      # which rewrites those libraries' obj/, makes them look stale and this compiles them all
      # again. Its own restore writes only tests/Tests' obj/, and is done long before the CLI's.
      - run:
          name: Build the tests (Release, beside the next steps)
          background: true
          command: |
            .circleci/beside start tests-build -- ./scripts/build/_dotnet-wrapper publish -c Release \
              tests/Tests/Tests.fsproj /p:BuildProjectReferences=false \
              /p:DebugType=None /p:DebugSymbols=false
      - sqlite-archive

      - run:
          name: Run migrations to create database
          command: python3 .circleci/collect_diagnostics.py --run migrations -- scripts/run-local-exec --published migrations run
      - run:
          name: Load packages into database
          command: python3 .circleci/collect_diagnostics.py --run packages -- scripts/build/reload-packages --published
      - assert-clean-worktree
      # The CLI embeds this seed, and the F# tests get their own copy of it instead of parsing
      # the same sources again.
      - run:
          name: Export the seed the CLI embeds
          command: python3 .circleci/collect_diagnostics.py --run seed -- scripts/run-local-exec --published export-seed rundir/seed.db

      # The host CLI, the way we ship it: `--mode=auto` resolves to NativeAOT on linux-x64. It is
      # a compile check, the binary the gates and package tests run, and the one the
      # instance-backed F# suites start a couple of thousand times a run, where the AOT binary
      # takes about half as long and a third of the CPU of a JIT-published one. Release
      # artifacts come from the tag-driven `release-clis` workflow.
      #
      # --reuse-libraries: only Cli is compiled, against the libraries the steps above built.
      # The publish would otherwise compile them all again, to the same bytes.
      - sqlite-archive-wait
      - run:
          name: Build the CLI
          command: ./scripts/build/build-release-cli-exes.sh --seed=rundir/seed.db --reuse-libraries
      - run:
          name: Wait for the tests to build
          command: .circleci/beside wait tests-build

      # Allocation for a fixed workload is steady enough to assert on and doesn't care how
      # loaded the box is, which is more than can be said for time. The gate grows a store of
      # its own, so the first run is cold, and budgets that run's allocation and peak memory
      # too. Time is only compared as a ratio: CPU against the release pinned in
      # scripts/perf/budget.json, run in turns on this same box. First of the checks on the
      # binary, because its CPU comparison wants the box to itself. Under a minute, with the
      # download of the newest release.
      - run:
          name: Check allocation, first-run memory, and CPU against the last release
          command: python3 .circleci/collect_diagnostics.py --run allocation -- scripts/perf/gate --published

      # Bounded, so a wedged suite dies at a known point with its log intact rather than
      # running until CircleCI's job cap. The runner emits a heartbeat every 30s, so the
      # default no-output timeout can no longer fire on a healthy-but-slow run.
      - run:
          name: Run F# tests
          command: |
            # --split runs the sequenced tests in two processes alongside the parallel ones.
            DARK_TEST_CLI="$PWD/$(ls clis/darklang-*-linux-x64)" \
            DARK_CONFIG_PACKAGES_SOURCE=seed python3 .circleci/collect_diagnostics.py \
              --run backend-tests -- timeout 20m scripts/run-fsharp-tests --published --split

      # The package tests and the gate scripts, at the same time. All of them run the shipped
      # binary, and each gate has its own rundir and HOME, which is what lets `gates all` run
      # every gate at once locally; package-tests is one of those gates. One after the other
      # they were about three minutes.
      #
      # first-day is a fresh install of the binary just built: empty home, the whole SCM
      # workflow, then the layout the installer leaves. It is not in `gates ci` because it
      # needs the single-file binary people download; see CI_GATES in scripts/testing/gates.
      # Nothing in this workflow gzips clis/ (only the release matrix's package-clis does), so
      # the bare binary is there. It runs after the CI subset, which ends well before the
      # package tests do, so it adds nothing to the wait. As a step of its own it was about 20s.
      #
      # Each package test starts a fresh process, so they use the NativeAOT CLI built here
      # rather than paying managed-runtime startup for every test.
      - run:
          name: Dark package tests and gate scripts (the CI subset, then first-day)
          command: |
            export CLI="clis/darklang-alpha-$(git rev-parse HEAD | cut -c 1-10)-linux-x64"
            # The gates print a summary when they finish; the package tests stream, which
            # keeps the step's no-output timer quiet while both run.
            (
              timeout 15m scripts/testing/gates ci --parallel
              ci_status=$?
              echo; echo "==> first-day"
              timeout 5m scripts/testing/gates first-day "$CLI"
              first_day_status=$?
              echo "first-day exited $first_day_status"
              [[ "$ci_status" -eq 0 && "$first_day_status" -eq 0 ]]
            ) > /tmp/gates-ci.log 2>&1 &
            gates=$!
            set +e
            timeout 20m scripts/testing/gates package-tests
            package_tests=$?
            wait "$gates"
            gates_status=$?
            set -e
            echo; echo "==> gate scripts (the CI subset, then first-day)"; cat /tmp/gates-ci.log
            echo; echo "package tests exited $package_tests, gate scripts exited $gates_status"
            [[ "$package_tests" -eq 0 && "$gates_status" -eq 0 ]]

      ## TODO: too many race conditions. Bring back later
      # Test package manager/cli integration works
      # - run: scripts/build/run-migrations --published
      # - run: sleep 5 # let migrations run
      # - run: scripts/build/reload-packages --published
      # - run: scripts/run-cli @Darklang.Stdlib.Float.add 1.9 2.0

      # Neither the tests nor a gate may write to the source tree.
      - assert-clean-worktree
      - show-large-files-and-directories
      - store-ci-diagnostics
      # The binary is ~37 MB a build, uncompressed. Kept only on a failure, so the binary that
      # failed can be run. A passing build's is cheaper to rebuild locally: check out the
      # commit, `scripts/dev/build`, export the seed, then `build-release-cli-exes.sh`.
      # Main's too: releases are downloaded from GitHub, nothing fetches main's from here,
      # and at every push to main it was most of the project's artifact storage.
      #
      # No `when:` on the step, so it is skipped once anything has failed. The upload
      # below runs either way: job #75213's did after its publish step failed.
      - run:
          name: Drop the CLI binary from passing builds
          command: rm -rf clis && mkdir clis
      - store_artifacts: { path: clis }

  ##########################
  # Release matrix (NativeAOT, fanned out by OS)
  #
  # NativeAOT runs ilc and then the *platform* linker, so a build host only
  # produces binaries for its own OS family. That's the whole reason this is a
  # fan-out rather than one cross-compiling container.
  #
  ##########################

  # Export the seed database once, and hand the same bytes to every build job.
  #
  # Two reasons this is its own job rather than something each builder does.
  # The seed export needs LocalExec, migrations and a full package load, which
  # a bare macOS VM has no cheap way to do. And the export is not safe against
  # concurrent use of the store: a build run while the store was live once
  # embedded a corrupt seed into every artifact it produced.
  seed-db:
    executor: in-container
    # medium+, like build: one compile at a time, which a fourth CPU barely speeds up.
    resource_class: medium+
    steps:
      - darkcheckout
      - setup-app
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks
      - run:
          name: Build LocalExec for migrations (debug mode fine)
          command: ./scripts/build/_dotnet-wrapper build src/LocalExec/LocalExec.fsproj
      - run:
          name: Run migrations to create database
          command: scripts/run-local-exec migrations run
      - run:
          name: Load packages into database
          command: scripts/build/reload-packages
      - run:
          name: Export the seed
          command: |
            sqlite3 rundir/data.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
            scripts/run-local-exec export-seed rundir/seed.db
      # From ~/.darklang, not the `rundir` link; the attaching jobs find it at ./seed.db.
      - persist_to_workspace:
          root: /home/dark/.darklang
          paths:
            - seed.db
      - persist_to_workspace:
          root: "."
          paths:
            # Hand over the hash file too, not just the seed.
            #
            # `reload-packages` above populates it, but it is gitignored, so the
            # build jobs' own checkout has only the empty one MSBuild creates.
            # They then embed THAT, and every ref in the shipped binary resolves
            # to "" -> `FnNotFound` on every command. It goes unnoticed inside a
            # source tree, because there the file on disk wins over the embedded
            # copy and the first run regenerates it. A user running the artifact
            # anywhere else has only the embedded copy.
            - backend/src/LibExecution/package-ref-hashes.txt

  # All four linux artifacts from one x64 runner. The cross-compiles work
  # because the release image supplies clang and cross sysroots; the stock
  # gcc in dark-base rejects ilc's `--target=<triple>` and the link fails.
  build-cli-linux-glibc:
    executor: release-linux
    # medium+, like build: one compile at a time, which a fourth CPU barely speeds up.
    resource_class: medium+
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks

      # SQLite static archives for the AOT link, built by zig cc from the amalgamation.
      # Every release, never from a cache: see the note on caches at the top of this file.
      - run:
          name: Build SQLite static archives
          command: |
            ./scripts/build/build-sqlite.sh \
              --runtimes=linux-x64,linux-arm64

      # Two linux runtimes are deliberately absent, for different reasons.
      #
      # linux-musl-x64: no cross sysroot in the release image, and it's the
      # target that failed the last time this was attempted.
      #
      # linux-arm (armv7): .NET 10's 32-bit ARM NativeAOT runtime needs glibc
      # symbols that only appeared in ~2.34, which puts its AOT floor well
      # above the one we target. Not something cross-compile flags can fix.
      #
      - run:
          name: AOT-publish the linux runtimes
          command: |
            ./scripts/build/build-release-cli-exes.sh \
              --mode=aot \
              --seed=seed.db \
              --runtimes=linux-x64,linux-arm64
      - run:
          name: Validate the linux-x64 artifact
          command: |
            # The CLI suite's instance-backed cases copy a store with sqlite3, and its
            # interactive cases get a pty from expect. The release image has neither.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends sqlite3 expect > /dev/null
            ./scripts/testing/validate-cli-artifact \
              "$(ls clis/darklang-*-linux-x64)"
      # arm64 can't run natively here, but it can run emulated, and it should.
      # A binary that links is not a binary that works: during this work an
      # armv7 build compiled, linked and started before dying on a struct
      # layout mismatch. Shipping an artifact that has never executed anywhere
      # is how that reaches a user instead of CI.
      #
      # A smoke run under qemu, not the full suite: emulation is slow and the
      # suite shells out per case. This catches "doesn't start" and "dies
      # immediately", which is the failure mode cross-compiling actually
      # produces.
      - run:
          name: Smoke-test the linux-arm64 artifact under emulation
          command: |
            qemu-aarch64-static -L /usr/aarch64-linux-gnu \
              "$(ls clis/darklang-*-linux-arm64)" version
            answer=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu \
              "$(ls clis/darklang-*-linux-arm64)" eval "1 + 2")
            [[ "$answer" == 3 ]] || { echo "eval 1 + 2 answered: $answer"; exit 1; }
      - run:
          name: Confirm the glibc floor of what we're shipping
          command: |
            objdump -T "$(ls clis/darklang-*-linux-x64)" \
              | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      # The build image IS the floor (20.04, glibc 2.31), so running the
      # artifact here rather than on a modern machine is what catches
      # symbols that only exist in newer glibc. That's not hypothetical: a
      # DllImport of "stat" worked everywhere we tested and threw on every
      # system below glibc 2.33, which is exactly the audience the low floor
      # exists to serve.
      #
      # Through the Dark wrappers, not the raw builtins: `syscallStatAt` returns an
      # opaque blob, so only the Dark-side decode can tell a good stat from a bad one.
      - run:
          name: Exercise the syscall transport at the glibc floor
          command: |
            X64="$(ls clis/darklang-*-linux-x64)"
            # `eval` is guest code under the deny-by-default instance policy.
            # TODO: narrow to `file read /etc/hostname` (and whatever getcwd needs).
            "$X64" permissions allow all > /dev/null
            "$X64" eval 'Stdlib.Cli.Posix.stat("/etc/hostname")' | tee /tmp/stat.out
            # The answer coreutils gives for the same file, field for field.
            H=/etc/hostname
            grep -qxF "Ok(Stdlib.Cli.Posix.StatResult { mode: $((16#$(stat -c %f $H))), size: $(stat -c %s $H), mtimeSec: $(stat -c %Y $H) })" /tmp/stat.out
            "$X64" eval 'Stdlib.Cli.Posix.getCwd()' | tee /tmp/cwd.out
            grep -qxF "Ok(\"$(pwd -P)\")" /tmp/cwd.out
      - package-clis

  # The runtimes built as ReadyToRun instead of AOT:
  # - linux-arm: AOT for armv7 needs a newer glibc than we support.
  # - osx-x64: R2R doesn't need a Mac, so it's built here, where it costs far less.
  build-cli-r2r-extras:
    executor: release-linux
    # medium+, like build: one compile at a time, which a fourth CPU barely speeds up.
    resource_class: medium+
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks
      - run:
          name: R2R-publish linux-arm and osx-x64
          command: |
            ./scripts/build/build-release-cli-exes.sh \
              --mode=r2r \
              --seed=seed.db \
              --runtimes=linux-arm,osx-x64
      - package-clis

  build-cli-linux-musl:
    executor: release-musl
    # medium+, like build: one compile at a time, which a fourth CPU barely speeds up.
    resource_class: medium+
    steps:
      - run:
          name: Install build dependencies
          command: |
            # cmake, openssl-dev and openssl-libs-static: the musl binary links OpenSSL
            # statically, and .NET builds its OpenSSL shim from source to do that. tar and
            # xz unpack the pinned toolchain. git and openssh-client are for `checkout`,
            # which otherwise falls back to CircleCI's own git client. sqlite and expect for the
            # CLI suite the artifact check runs. lld and llvm (for llvm-objcopy) cross-link
            # arm64, and qemu-aarch64 runs the result.
            apk add --no-cache bash git openssh-client curl clang build-base zlib-dev openssl \
              icu-libs cmake openssl-dev openssl-libs-static tar xz sqlite expect lld llvm qemu-aarch64
      - checkout
      - run:
          name: Install the pinned .NET SDK and zig
          command: |
            # The image ships a newer SDK patch than backend/global.json pins, and that file
            # sets rollForward: disable, so every dotnet command fails until the exact version
            # is present. build-sqlite.sh looks for zig at $HOME/zig/zig.
            scripts/build/install-release-toolchain linux-musl-x64 /usr/share/dotnet "$HOME/zig"
            dotnet --version
      - attach_workspace: { at: "." }
      - run:
          name: Install the aarch64 musl sysroot
          command: scripts/build/install-musl-sysroot aarch64
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks
      - run:
          name: Build the musl SQLite archives
          command: ./scripts/build/build-sqlite.sh --runtimes=linux-musl-x64,linux-musl-arm64
      - run:
          name: AOT-publish linux-musl-x64 and linux-musl-arm64
          command: |
            # zig on PATH: the arm64 syscall transport is cross-compiled with it
            # (backend/native/build.sh).
            export PATH="$HOME/zig:$PATH"
            ./scripts/build/build-release-cli-exes.sh \
              --mode=aot \
              --seed=seed.db \
              --runtimes=linux-musl-x64,linux-musl-arm64
      # Natively runnable here, unlike the cross-built targets: this job *is*
      # Alpine. The binary no longer needs that, which the next step checks.
      - run:
          name: Validate the musl artifact
          command: |
            ./scripts/testing/validate-cli-artifact \
              "$(ls clis/darklang-*-linux-musl-x64)"
      # The point of linking it statically: it needs nothing from the system. musl's
      # `ldd` can't say so (it is the loader itself and lists itself), so read the ELF
      # for a loader or a needed library, then run the binary in an empty root that
      # holds only it, the CA bundle, the DNS config and a random source. That is a
      # `FROM scratch` container without needing docker here.
      - run:
          name: Confirm the musl artifacts need no system libraries
          command: |
            for B in clis/darklang-*-linux-musl-x64 clis/darklang-*-linux-musl-arm64; do
              if readelf -lW "$B" | grep -q INTERP || readelf -dW "$B" | grep -q NEEDED; then
                echo "$B is dynamically linked:"
                readelf -lW "$B" | grep -A1 INTERP || true
                readelf -dW "$B" | grep NEEDED || true
                exit 1
              fi
            done
            B="$(ls clis/darklang-*-linux-musl-x64)"
            ROOT=$(mktemp -d)
            mkdir -p "$ROOT/etc/ssl/certs" "$ROOT/tmp" "$ROOT/dev"
            cp "$B" "$ROOT/dark"
            # .NET reads its random bytes from /dev/urandom and won't start without it. CI's
            # container can't make device nodes (no CAP_MKNOD), so a FIFO fed from the real
            # one stands in for it. Each reader's exit ends one `cat` with SIGPIPE, hence the
            # loop and the `|| true` (steps run under `bash -e`).
            mkfifo "$ROOT/dev/urandom"
            ( while :; do cat /dev/urandom > "$ROOT/dev/urandom" || true; done ) > /dev/null 2>&1 &
            FEEDER=$!
            trap 'kill "$FEEDER"' EXIT
            cp /etc/ssl/certs/ca-certificates.crt "$ROOT/etc/ssl/certs/"
            cp /etc/resolv.conf /etc/hosts "$ROOT/etc/"
            in_empty_root() { HOME=/tmp chroot "$ROOT" /dark "$@" < /dev/null; }
            in_empty_root eval "1 + 2" | tee /tmp/eval.out
            grep -qx 3 /tmp/eval.out
            in_empty_root permissions allow all > /dev/null
            # The TLS stack is what static OpenSSL changes, so make one real HTTPS request.
            # Retried, so a network blip isn't read as a broken binary.
            for attempt in 1 2 3; do
              in_empty_root eval \
                'Stdlib.HttpClient.get("https://example.com", []) |> Stdlib.Result.map(fun r -> r.statusCode)' \
                | tee /tmp/https.out
              grep -q 'Ok(200)' /tmp/https.out && break
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
      # Cross-linked, so it has never run until here. A smoke run under qemu rather than the
      # suite, as for the glibc arm64 build: emulation is slow, and what a cross build gets
      # wrong shows at startup. The HTTPS request checks the OpenSSL shim, which is the part
      # built for arm64 separately (scripts/build/cross-openssl-shim.cmake).
      - run:
          name: Smoke-test the linux-musl-arm64 artifact under emulation
          command: |
            A="$(ls clis/darklang-*-linux-musl-arm64)"
            export HOME="$(mktemp -d)"
            qemu-aarch64 "$A" version
            answer=$(qemu-aarch64 "$A" eval "1 + 2")
            [ "$answer" = 3 ] || { echo "eval 1 + 2 answered: $answer"; exit 1; }
            qemu-aarch64 "$A" permissions allow all > /dev/null
            for attempt in 1 2 3; do
              qemu-aarch64 "$A" eval \
                'Stdlib.HttpClient.get("https://example.com", []) |> Stdlib.Result.map(fun r -> r.statusCode)' \
                | tee /tmp/https-arm64.out
              grep -q 'Ok(200)' /tmp/https-arm64.out && break
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
      - package-clis

  build-cli-macos:
    executor: macos-builder
    steps:
      - checkout
      - attach_workspace: { at: "." }
      # build-sqlite.sh writes to app/backend/src/Cli/lib relative to ~, so
      # the checkout has to live at ~/app here the same as it does in the
      # container. That's what working_directory on the executor is for.
      - run:
          name: Install the pinned .NET SDK and zig
          command: |
            scripts/build/install-release-toolchain osx-arm64 "$HOME/.dotnet" "$HOME/zig"
            echo 'export PATH="$HOME/.dotnet:$PATH"' >> "$BASH_ENV"
      - run: ./scripts/build/_dotnet-wrapper tool restore
      - run: ./scripts/build/_dotnet-wrapper paket restore --fail-on-checks
      - run:
          name: Build SQLite static archives
          command: ./scripts/build/build-sqlite.sh --runtimes=osx-arm64
      # Only osx-arm64 (Apple Silicon) is built here. osx-x64 (Intel) is built in
      # build-cli-r2r-extras, as R2R rather than AOT: CircleCI has no Intel Macs to test an
      # AOT build on.
      - run:
          name: AOT-publish osx-arm64
          command: |
            ./scripts/build/build-release-cli-exes.sh \
              --mode=aot \
              --seed=seed.db \
              --runtimes=osx-arm64
      - run:
          name: Validate the osx-arm64 artifact
          command: |
            ./scripts/testing/validate-cli-artifact \
              "$(ls clis/darklang-*-osx-arm64)"
      - package-clis

  publish-release-clis:
    executor: in-container
    steps:
      - darkcheckout
      - setup-app
      - attach_workspace: { at: "." }
      - run:
          name: Show what we're about to publish
          command: ls -la clis/
      - run: ./scripts/deployment/publish-github-release

  #
  # Does nothing itself. The workflow runs it only after every build job has
  # passed, so a green ok-to-deploy on a commit means the whole build passed on
  # its tree: in this pipeline, or in the one the `proven` job links to.
  # scripts/deployment/release checks for that before releasing a commit.
  ok-to-deploy:
    executor: simple-executor
    steps:
      - run:
          name: No operation
          command: "true"

  # Main only, for a commit main had already moved past when its pipeline started. Says which
  # newer commit builds its changes. There is no ok-to-deploy for it, so it is never released.
  superseded:
    executor: simple-executor
    steps:
      - run:
          name: Skip the build
          command: |
            echo "main moved on to << pipeline.parameters.superseded-by >> before this build started."
            echo "That commit's pipeline builds and tests this one's changes too."

  # A commit whose tree a green build already checked: on main, a PR merged while up to date
  # with main; on a branch, a push that changes no file. Links to that build's ok-to-deploy.
  proven:
    executor: simple-executor
    steps:
      - run:
          name: Skip the build
          command: |
            echo "This tree already passed the build: << pipeline.parameters.proven-by >>"
            echo "The same files give the same answer, so this pipeline doesn't build them again."

  # Branches and PRs that change only prose: nothing for the build to check. Never on main.
  docs-only:
    executor: simple-executor
    steps:
      - run:
          name: Skip the build
          command: echo "Only prose changed since this branch left main, so there is nothing to build."

  #
  # Switched off. Main releases only when someone runs scripts/deployment/release.
  # Switching it on also needs GITHUB_RELEASES_TOKEN in a context of its own, restricted to
  # main: `github-release` is restricted to tags.
  #
  # When switched on, this tags every green merge to main with the next v0.0.N,
  # which releases it. To switch it on, uncomment this job and its entry under
  # build-and-deploy below.
  # tag-release:
  #   executor: in-container
  #   steps:
  #     - darkcheckout
  #     - run: ./scripts/deployment/tag-release

workflows:
  build-and-deploy:
    unless:
      or:
        - << pipeline.parameters.superseded-by >>
        - << pipeline.parameters.proven-by >>
        - << pipeline.parameters.docs-only >>
    jobs:
      - build

      # Passes only when the build did. scripts/deployment/release checks
      # it before tagging, and tag-release waits on it.
      - ok-to-deploy:
          requires:
            - build

      # Release every green merge to main; see the tag-release job.
      # - tag-release:
      #     filters:
      #       branches:
      #         only: main
      #     requires: [ok-to-deploy]


  superseded:
    when: << pipeline.parameters.superseded-by >>
    jobs:
      - superseded

  # Gets an ok-to-deploy like a build would, so main's tip stays releasable when it is a
  # proven merge: scripts/deployment/release looks for that check on the tip.
  proven:
    when: << pipeline.parameters.proven-by >>
    jobs:
      - proven
      - ok-to-deploy:
          requires: [proven]

  docs-only:
    when: << pipeline.parameters.docs-only >>
    jobs:
      - docs-only

  # The NativeAOT release matrix. Normally tag-only; see the
  # release-matrix-on-every-push parameter at the top of this file.
  #
  # The CircleCI trap here: a tag-filtered job's entire `requires` chain needs
  # tag filters too. Miss one and a tag build silently runs nothing. Every job
  # below carries the anchor for that reason, including seed-db.
  release-clis:
    when:
      or:
        - << pipeline.parameters.release-matrix-on-every-push >>
        - << pipeline.git.tag >>
    jobs:
      - seed-db:
          filters: &release-filters
            tags:
              only: /^v.*/
            # Tags only. To watch the matrix on a branch, allow it here and set
            # release-matrix-on-every-push at the top of this file; both are
            # needed. One gotcha if you do: on a fork, CircleCI reports a PR's
            # branch as `pull/<number>` rather than the branch name, so matching
            # the branch name alone filters every job out and the workflow
            # silently does not appear at all.
            branches:
              ignore: /.*/

      - build-cli-linux-glibc:
          filters: *release-filters
          requires: [seed-db]

      - build-cli-linux-musl:
          filters: *release-filters
          requires: [seed-db]

      - build-cli-macos:
          filters: *release-filters
          requires: [seed-db]

      - build-cli-r2r-extras:
          filters: *release-filters
          requires: [seed-db]

      # Publishing is tags-only regardless of the parameter above. The build
      # jobs run on this branch while the matrix is being debugged, and they
      # should: the artifacts are the point. Publishing on a branch push is
      # different, because publish-github-release creates a real GitHub
      # release, and without a tag it has no version to give it. Main gets
      # its releases by scripts/deployment/release pushing one, not through
      # this filter.
      - publish-release-clis:
          context: github-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-cli-linux-glibc
            - build-cli-linux-musl
            - build-cli-macos
            - build-cli-r2r-extras
