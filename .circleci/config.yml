version: 2.1

# Entry point. Every pipeline starts here, makes sure the images it runs in exist, and
# then continues with .circleci/continue.yml, where the build and release jobs live.
#
# CircleCI can't compute an image tag inside a config, so the tags are worked out here
# and handed over as pipeline parameters. See scripts/deployment/ci-images.

setup: true

jobs:
  # Pushes main's images to Docker Hub. The only job that runs with the push token: it
  # lives in the `dockerhub-publish` context, which CircleCI restricts to main, so no
  # other branch, fork PR or tag can use it, whatever its config says.
  publish-images:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - fetch-commit
      - run:
          name: Build and push the images if this commit needs new ones
          command: scripts/deployment/ci-images --publish

  # Picks the image every job runs in, by digest, and continues the pipeline with them.
  # Main and release tags take them from Docker Hub only. Anything else builds the ones
  # Docker Hub doesn't have yet into ttl.sh.
  images:
    # A machine, not a container, because building an image needs docker. One starts
    # in a few seconds, and most pipelines only look up two digests and move on.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - fetch-commit
      - run:
          name: Find or build the images
          command: scripts/deployment/ci-images > /tmp/images.json
          # pushing a freshly built image to ttl.sh prints nothing while it uploads
          no_output_timeout: 30m
      # On main only: a commit main has already moved past skips the build, since the newer
      # commit's pipeline builds this one's changes too. See the script.
      - run:
          name: Check whether main has moved past this commit
          command: |
            newer=$(scripts/deployment/ci-superseded)
            [[ -z "$newer" ]] || echo "main has moved on to $newer, so this pipeline skips the build"
            jq --arg newer "$newer" '. + {"superseded-by": $newer}' /tmp/images.json > /tmp/superseded.json
      # A tree a green build already checked, here or in its PR, skips the build. See the script.
      - run:
          name: Check whether this tree already passed the build
          command: |
            proof=""
            if [[ -z "$(jq -r '."superseded-by"' /tmp/superseded.json)" ]]; then
              proof=$(scripts/deployment/ci-proven)
            fi
            [[ -z "$proof" ]] || echo "This tree already passed in $proof, so this pipeline skips the build"
            jq --arg proof "$proof" '. + {"proven-by": $proof}' /tmp/superseded.json > /tmp/proven.json
      # Branches and PRs only: one that changes nothing but prose skips the build.
      - run:
          name: Check whether this change is prose only
          command: |
            docs_only=""
            if [[ -z "$(jq -r '."proven-by"' /tmp/proven.json)" ]]; then
              docs_only=$(scripts/deployment/ci-docs-only)
            fi
            [[ -z "$docs_only" ]] || echo "Only prose changed since this branch left main, so this pipeline skips the build"
            jq --argjson docs "${docs_only:-false}" '. + {"docs-only": $docs}' /tmp/proven.json > /tmp/parameters.json
      - run:
          name: Continue in those images
          command: |
            cat /tmp/parameters.json
            jq -n \
              --arg key "$CIRCLE_CONTINUATION_KEY" \
              --rawfile config .circleci/continue.yml \
              --slurpfile parameters /tmp/parameters.json \
              '{"continuation-key": $key, configuration: $config, parameters: $parameters[0]}' \
              | curl -fsS --retry 5 -X POST -H "Content-Type: application/json" --data @- \
                  https://circleci.com/api/v2/pipeline/continue

commands:
  # This commit and its parent, without a full clone: the tags hash a few files, and
  # publishing compares them with the parent's. Same fetch as `shallow-checkout` in
  # continue.yml.
  fetch-commit:
    steps:
      - run:
          name: Checkout code (this commit and its parent)
          command: |
            git init -q .
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            if ! git fetch -q --depth=2 origin "$CIRCLE_SHA1"; then
              git fetch -q --depth=2 origin "refs/pull/${CIRCLE_PULL_REQUEST##*/}/head"
            fi
            git checkout -q --detach FETCH_HEAD

# A setup config may run one workflow per pipeline, hence `when` and `unless`.
workflows:
  main:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - publish-images:
          context: dockerhub-publish
      - images:
          requires: [publish-images]

  setup:
    unless:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - images:
          # Release tags go through here too, so the matrix in continue.yml can run.
          filters:
            tags:
              only: /^v.*/
