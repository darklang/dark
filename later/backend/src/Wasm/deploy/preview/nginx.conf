worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types { application/wasm wasm; application/octet-stream db br dat blat; application/json json; }
  default_type application/octet-stream;
  sendfile on;
  gzip_vary on;
  server {
    listen 8080;
    root /data;
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    # Fingerprinted runtime files, on disk only as .gz: `always` serves those whether or not
    # the client asked, typed by the URI's extension.
    location ~ ^/(pulls/[0-9]+|latest)/_framework/ {
      gzip_static always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # /pulls/12 -> /pulls/12/ so the pages' relative paths resolve inside the site.
    location ~ ^/(pulls/[0-9]+|latest)$ { return 302 $uri/; }
    # Anything with nothing behind it is a 404 whose body says what it was and what is current.
    error_page 404 /gone.html;
    location ~ ^/(gone\.html|preview\.css)$ { root /usr/share/preview; add_header Cache-Control "no-cache"; }
    location / {
      gzip_static on;
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
    }
  }
}
