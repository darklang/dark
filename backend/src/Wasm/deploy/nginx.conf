# Static hosting for the published wasm site. The publish writes .br and .gz next to
# every asset; gzip_static/brotli would serve those, but stock nginx has no brotli
# module, so gzip_static covers it (the .gz files are there) and .br is ignored.
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    application/octet-stream db snapshot dat blat;
    application/gzip gz;
    application/json json;
  }
  default_type application/octet-stream;
  sendfile on;
  gzip_static on;
  gzip_vary on;
  # Serve `data.db.gz` for `data.db` too (gzip_static needs the .gz beside the file).
  server {
    listen 8080;
    root /site;
    index cli.html;
    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control "public, max-age=300";
    }
    # Fingerprinted runtime files never change under the same name.
    location /_framework/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
