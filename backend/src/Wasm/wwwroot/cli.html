<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Darklang CLI</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <!-- The store downloads while the runtime does; Boot's fetch of the same URL hits the cache. -->
  <link rel="preload" href="data.db.br" as="fetch" crossorigin="anonymous" />
  <style>
    :root { color-scheme: dark; --bg:#0f1117; --fg:#e6e8ee; --muted:#8b90a0; --accent:#7c9cff;
            --ok:#6ee7a8; --err:#ff8a8a; --border:#262b38;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
    header { padding:8px 14px; border-bottom:1px solid var(--border); display:flex;
             align-items:baseline; gap:12px; flex: none; }
    header h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.3px; }
    header .status { font-size:12px; color:var(--muted); margin-left:auto; }
    header .status.busy { color:var(--accent); }
    header .status.ready { color:var(--ok); }
    header .status.err { color:var(--err); }
    header a { color:var(--muted); font-size:12px; text-decoration:none; }
    header a:hover { color:var(--fg); }
    header button { background:transparent; color:var(--muted); border:1px solid var(--border);
                    border-radius:6px; font:inherit; font-size:12px; padding:2px 8px; cursor:pointer; }
    header button:hover, header button.on { color:var(--fg); border-color:var(--accent); }
    #main { flex:1; min-height:0; display:flex; }
    #term { flex:1; min-width:0; min-height:0; padding:6px; }
    #term .xterm { height: 100%; }
    /* The command panel: one-shot `dark <cmd>` runs beside the workbench, same store. */
    #panel { width: 44%; min-width: 320px; border-left:1px solid var(--border); display:flex;
             flex-direction:column; min-height:0; }
    #panel[hidden] { display:none; }
    #panel .out { flex:1; overflow:auto; padding:10px 12px; font-size:13px; line-height:1.45;
                  white-space:pre-wrap; margin:0; }
    #panel .out .cmd { color:var(--accent); }
    #panel .out .exit { color:var(--muted); }
    #panel .out .err { color:var(--err); }
    #panel form { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--border); }
    #panel form span { color:var(--accent); }
    #panel input { flex:1; background:transparent; border:none; color:var(--fg); font:inherit;
                   font-size:13px; outline:none; }
    @media (max-width: 800px) { #main { flex-direction:column; } #panel { width:auto; min-width:0;
             border-left:none; border-top:1px solid var(--border); height:40%; } }
  </style>
</head>
<body>
  <header>
    <h1>Darklang CLI</h1>
    <a href="index.html">REPL</a>
    <button id="toggle" type="button" title="Run dark commands beside the workbench (same store)">commands</button>
    <span class="status" id="status">loading runtime</span>
  </header>
  <div id="main">
    <div id="term"></div>
    <div id="panel" hidden>
      <pre class="out" id="pout">dark commands run here, one at a time, against the same store the workbench is showing.
Anything that opens a screen of its own (workbench, outliner, views, apps) belongs in the terminal.
</pre>
      <form id="pform"><span>dark</span><input id="pin" autocomplete="off" placeholder="status" /></form>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <!-- Blazor WASM runtime; produced by `dotnet publish` (see README.md). -->
  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    const status = document.getElementById("status");
    const setStatus = (text, cls) => { status.textContent = text; status.className = "status " + (cls || ""); };

    const term = new Terminal({
      cursorBlink: true, convertEol: true, scrollback: 5000, fontSize: 14,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      theme: { background: "#0f1117", foreground: "#e6e8ee" },
      allowProposedApi: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();

    // .NET buffers everything it prints; the page drains it (Host/Browser.fs: DrainOutput).
    // A whole TUI frame arrives as one write, and the interpreter never calls into JS itself.
    let draining = false;
    async function drain() {
      if (draining) return;
      draining = true;
      try { const s = await invoke("DrainOutput"); if (s) term.write(s); }
      catch (e) { /* runtime not ready yet */ }
      finally { draining = false; }
    }

    // The URL contract. `?cmd=docs Stdlib.List.map` runs that command (URL-encoded, split
    // on whitespace, double quotes group). `?fn=Darklang.Stdlib.List.map` is sugar for
    // `?cmd=view <name>`. No params: the workbench, same as `dark` with no arguments.
    function argvFromUrl() {
      const params = new URLSearchParams(location.search);
      const fn = params.get("fn");
      if (fn) return ["view", fn];
      const cmd = params.get("cmd");
      return cmd ? splitArgv(cmd) : [];
    }
    function splitArgv(text) {
      const argv = []; let cur = ""; let quoted = false;
      for (const ch of text) {
        if (ch === '"') { quoted = !quoted; continue; }
        if (!quoted && /\s/.test(ch)) { if (cur) { argv.push(cur); cur = ""; } continue; }
        cur += ch;
      }
      if (cur) argv.push(cur);
      return argv;
    }

    let running = false;
    const invoke = (name, ...args) => DotNet.invokeMethodAsync("Darklang.Wasm", name, ...args);

    // The command panel.
    const panel = document.getElementById("panel");
    const pout = document.getElementById("pout");
    const pin = document.getElementById("pin");
    const toggle = document.getElementById("toggle");
    toggle.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      toggle.classList.toggle("on", !panel.hidden);
      fit.fit(); reportSize();
      if (!panel.hidden) pin.focus(); else term.focus();
    });
    const takesTheScreen = new Set(["workbench", "wb", "outliner", "tree-exp", "views", "apps", "text-editor", "agent", "ai"]);
    let commandRunning = false;
    const history = []; let hi = 0;
    document.getElementById("pform").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const line = pin.value.trim();
      if (!line || commandRunning || !running) return;
      const argv = splitArgv(line);
      const add = (cls, text) => { const s = document.createElement("span"); s.className = cls; s.textContent = text; pout.appendChild(s); pout.scrollTop = pout.scrollHeight; };
      add("cmd", "$ dark " + line + "\n");
      if (takesTheScreen.has(argv[0])) { add("err", "that one takes over the screen; run it in the terminal\n"); pin.value = ""; return; }
      history.push(line); hi = history.length; pin.value = "";
      commandRunning = true;
      try {
        const out = await invoke("RunCommand", argv);
        const i = out.lastIndexOf("\n[exit ");
        add("", out.slice(0, i).replace(/\x1b\[[0-9;]*[A-Za-z]/g, ""));
        add("exit", out.slice(i + 1) + "\n\n");
      } catch (e) { add("err", "failed: " + (e && e.message ? e.message : e) + "\n"); }
      finally { commandRunning = false; pin.focus(); }
    });
    pin.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowUp" && hi > 0) { hi--; pin.value = history[hi]; ev.preventDefault(); }
      else if (ev.key === "ArrowDown") { hi = Math.min(history.length, hi + 1); pin.value = history[hi] || ""; ev.preventDefault(); }
    });
    let drainTimer = null;

    // Keys go straight to .NET as DOM key names; xterm never sees them (returning false
    // stops its own handling), so nothing echoes twice. Paste arrives through onData.
    term.attachCustomKeyEventHandler((ev) => {
      if (ev.type !== "keydown") return false;
      if (!running) return false;
      // Let the browser keep its own clipboard shortcuts.
      if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === "V" || ev.key === "C")) return true;
      if (ev.metaKey) return true;
      invoke("PushKey", ev.key, ev.ctrlKey, ev.altKey, ev.shiftKey);
      ev.preventDefault();
      return false;
    });
    term.onData((data) => {
      if (!running) return;
      // Everything that reaches here is a paste (or IME text): keys were intercepted above.
      if (data.length > 0) invoke("PushPaste", data);
    });

    function reportSize() {
      if (!running) return;
      invoke("SetTerminalSize", term.cols, term.rows);
    }
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { fit.fit(); reportSize(); }, 80);
    });

    async function waitForDispatcher() {
      for (let i = 0; i < 120; i++) {
        if (typeof DotNet !== "undefined") {
          try { await invoke("Ready"); return true; } catch (e) { /* not yet */ }
        }
        await new Promise((r) => setTimeout(r, 500));
      }
      return false;
    }
    async function waitFor(cond, tries) {
      for (let i = 0; i < tries; i++) {
        if (cond()) return true;
        await new Promise((r) => setTimeout(r, 250));
      }
      return false;
    }

    (async () => {
      term.write("\x1b[90mloading the Darklang runtime...\x1b[0m\r\n");
      try {
        if (!(await waitFor(() => typeof Blazor !== "undefined" && Blazor.start, 80)))
          throw new Error("_framework/blazor.webassembly.js did not load");
        await Blazor.start();
        if (!(await waitForDispatcher())) throw new Error("runtime did not become ready");
      } catch (e) {
        setStatus("runtime not loaded: " + (e && e.message ? e.message : e), "err");
        term.write("\x1b[31mruntime failed to load: " + (e && e.message ? e.message : e) + "\x1b[0m\r\n");
        console.error("Darklang CLI boot failed:", e);
        return;
      }
      drainTimer = setInterval(drain, 25);
      try {
        setStatus("loading the package store", "busy");
        term.write("\x1b[90mloading the package store...\x1b[0m\r\n");
        const t0 = performance.now();
        // store.json names the file and its inflated size (the one-shot brotli decoder needs it).
        const manifest = await (await fetch(new URL("store.json", document.baseURI))).json();
        await invoke("Boot", new URL(manifest.file, document.baseURI).href, manifest.size);
        term.write("\x1b[90mstore ready in " + Math.round(performance.now() - t0) + " ms\x1b[0m\r\n");
      } catch (e) {
        setStatus("store failed to load", "err");
        term.write("\x1b[31mstore failed to load: " + (e && e.message ? e.message : e) + "\x1b[0m\r\n");
        console.error("Darklang CLI store load failed:", e);
        return;
      }
      const argv = argvFromUrl();
      const params = new URLSearchParams(location.search);
      if (params.get("panel") === "1") toggle.click();
      if (params.get("trace") === "1") await invoke("SetTrace", true);
      for (const kv of params.getAll("env")) {
        const i = kv.indexOf("="); if (i > 0) await invoke("SetEnv", kv.slice(0, i), kv.slice(i + 1));
      }
      if (params.get("probe") === "1") {
        console.log("[probe] getFn"); console.log("[probe] getFn =", await invoke("ProbeGetFn", "f786aeeaccc9a548b132bb0329373d028c3d312ee3230e6134b022ec9275c952"));
        console.log("[probe] harmful"); console.log("[probe] harmful =", await invoke("ProbeHarmful"));
      }
      setStatus("running", "ready");
      running = true;
      fit.fit();
      await invoke("SetTerminalSize", term.cols, term.rows);
      term.focus();
      try {
        let code = await invoke("RunCli", argv);
        // A one-shot command (`?cmd=`, `?fn=`) printed and returned; keep the visitor in the
        // CLI at the classic inline prompt, which leaves that output in scrollback. The
        // workbench would take the alternate screen and hide it.
        if (argv.length > 0 && running) {
          await drain();
          await invoke("SetEnv", "DARK_CLASSIC", "1");
          term.write("\r\n");
          code = await invoke("RunCli", []);
        }
        running = false;
        await drain();
        setStatus("exited with " + code, code === 0 ? "" : "err");
        term.write("\r\n\x1b[90m[the CLI exited with " + code + "; reload to start again]\x1b[0m\r\n");
      } catch (e) {
        running = false;
        await drain();
        setStatus("crashed", "err");
        term.write("\r\n\x1b[31mthe CLI crashed: " + (e && e.message ? e.message : e) + "\x1b[0m\r\n");
        console.error("Darklang CLI crashed:", e);
      }
    })();
  </script>
</body>
</html>
